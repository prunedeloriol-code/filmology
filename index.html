body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-size:28px;margin:0;color:var(--ac);font-weight:600}
.count{color:var(--mut);font-size:13px;margin-top:2px}
input[type=search]{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sync{margin-top:6px;font-size:12.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sync input{flex:1;min-width:180px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.addpanel{background:var(--card);border-radius:12px;padding:10px 12px;max-height:50vh;overflow:auto}.addpanel input{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.ar{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--fg);font:inherit}
.ar img,.ar i{width:40px;height:60px;border-radius:6px;object-fit:cover;background:var(--ph);flex:none}.ar small{color:var(--mut)}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.srow{display:flex;gap:8px}.srow input[type=search]{flex:1;min-width:0}
.plus{flex:none;width:46px;border:1px solid var(--line);background:var(--card);color:var(--ac);border-radius:12px;font:inherit;font-size:24px;line-height:1;cursor:pointer}
.plus[aria-expanded=true]{background:var(--ac);border-color:var(--ac);color:#fff}
:root[data-theme=dark] .plus[aria-expanded=true]{color:#14122b}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .plus[aria-expanded=true]{color:#14122b}}
.fbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fbtn{min-width:0;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn.on{border-color:var(--ac2);background:var(--acsoft);color:var(--ac);font-weight:700}
.fbtn[aria-expanded=true]{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
@media (max-width:340px){.fbar{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sortrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-top:6px}.sortrow select{flex:1;font:inherit;padding:6px 8px;border-radius:10px;border:1px solid #d6d6e8;background:var(--card);color:inherit}
.fpanel{background:var(--card);border-radius:12px;padding:10px;max-height:40vh;overflow:auto}
.count .chip{margin-left:8px;padding:2px 10px;font-size:12px}
.up{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;width:46px;height:46px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}

.fg{display:flex;flex-direction:column;gap:6px}.fg h2{margin:0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.rate{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:6px 8px;border-radius:12px;background:var(--ac);color:#fff;line-height:1}
.rate b{font-size:20px;font-variant-numeric:tabular-nums}.rate span{font-size:9.5px;letter-spacing:.08em;margin-top:3px;opacity:.85}
.t-film .rate:not(.na),.t-film .badge:not(.warn){background:var(--film)}.t-serie .rate:not(.na),.t-serie .badge:not(.warn){background:var(--serie)}.t-doc .rate:not(.na),.t-doc .badge:not(.warn){background:var(--doc)}

:root[data-theme=dark] .rate:not(.na){color:#14122b}

.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}

@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .chip[aria-pressed=true]{color:#14122b}}
.card{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;box-shadow:0 1px 2px rgba(30,20,90,.08)}
.poster{flex:0 0 84px;width:84px;height:126px;border-radius:8px;background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;color:var(--ac)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.body{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.top{display:flex;gap:8px;align-items:flex-start}
.top label{display:flex;gap:8px;align-items:flex-start;min-width:0;cursor:pointer}
.top input{margin-top:3px;width:18px;height:18px;accent-color:var(--ac2);flex:none}
.title{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.vu .title{text-decoration:line-through;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mut)}
.badge{background:var(--acsoft);color:var(--ac);border-radius:6px;padding:2px 7px;font-weight:700;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase}

.note{font-weight:700;color:var(--fg)}
.alt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}

.none{font-size:12.5px;color:var(--mut)}
.okb{color:var(--ok);border-color:var(--ok)}
.pl.bad{background:var(--badbg);color:var(--bad);border:1.5px solid var(--bad)}

.poster[data-a]{cursor:pointer}

.acts a{color:var(--ac2);font-size:12.5px;font-weight:500}
.avis{display:flex;gap:4px;margin-left:auto}

.avis button[aria-pressed=true]{background:var(--acsoft);border-color:var(--ac2)}
.del{font-size:12px;color:var(--mut)}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px}
.foot{color:var(--mut);font-size:12px;text-align:center;padding:8px 0}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}

  const fl=[];const e=nm(es.flatrate),m=nm(mx.flatrate);
  if(e.includes('Netflix')||e.includes('Netflix Standard with Ads'))fl.push('Netflix');
  if(m.some(x=>x.startsWith('Amazon Prime Video')))fl.push('Prime Video');
  if(e.some(x=>x==='HBO Max'||x==='Max'))fl.push('HBO');
  if(e.includes('Disney Plus'))fl.push('Disney+');
  return{rent:nm(es.rent).concat(nm(es.buy)).some(x=>x==='Apple TV'||x==='Apple iTunes'),fl,ts:Date.now()}}
const queue=[];let running=false;
async function pump(){if(running)return;running=true;while(queue.length){const d=queue.shift();try{const j=await tm(`/${d.tt==='m'?'movie':'tv'}/${d.tm}/watch/providers`);const pi=provInfo(j);prov[d.id]=pi;try{localStorage.setItem('filmology-prov',JSON.stringify(prov))}catch(e){}
  const el=document.querySelector(`[data-card="${d.id}"] .dispo`);if(el){const old=el.querySelector('.rent');if(pi.rent&&!old){const sp=document.createElement('span');sp.className='pl rent';sp.textContent='Location Apple TV';el.appendChild(sp)}}}catch(e){}await new Promise(r=>setTimeout(r,120))}running=false}
const io=('IntersectionObserver'in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);const d=DATA.find(x=>x.id===+e.target.dataset.card);if(d&&d.tm&&(!prov[d.id]||Date.now()-prov[d.id].ts>864e5)){queue.push(d);pump()}}}),{rootMargin:'300px'}):null;
function watchCards(){if(!POSTERS||!io)return;document.querySelectorAll('[data-card]').forEach(c=>io.observe(c))}
/* Ajout d'un titre */
const GM={'Science-Fiction':['SF'],'Sci-Fi & Fantasy':['SF','Fantastique'],'Action & Adventure':['Action','Aventure'],'War & Politics':['Guerre'],'Reality':['Téléréalité'],'Téléréalité':['Téléréalité'],'Familial':[],'Kids':[],'Téléfilm':[],'Histoire':[],'News':[],'Soap':[],'Talk':[]};
function mapG(gs){const o=[];gs.forEach(g=>{(GM[g.name]||(g.name in GM?[]:[g.name])).forEach(x=>{if(!o.includes(x))o.push(x)})});return o.slice(0,3)}
let aT=null;
aq.addEventListener('input',()=>{clearTimeout(aT);const t=aq.value.trim();if(t.length<2){ares.innerHTML='';return}aT=setTimeout(async()=>{try{const j=await tm('/search/multi',{query:t,language:'fr-FR'});
  const L=(j.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,6);
  ares.innerHTML=L.map(x=>`<button class="ar" data-m="${x.media_type}" data-i="${x.id}">${x.poster_path?`<img alt="" src="https://image.tmdb.org/t/p/w92${x.poster_path}">`:'<i></i>'}<span><b>${esc(x.title||x.name)}</b><br><small>${x.media_type==='movie'?'Film':'Série'} · ${(x.release_date||x.first_air_date||'').slice(0,4)||'?'}</small></span></button>`).join('')||'<div class="none">Aucun résultat</div>'}catch(e){ares.innerHTML='<div class="none">Recherche impossible pour le moment</div>'}},350)});
async function addTitle(m,i){const [d,p]=await Promise.all([tm(`/${m}/${i}`,{language:'fr-FR',append_to_response:'external_ids'}),tm(`/${m}/${i}/watch/providers`)]);
  const pi=provInfo(p),g=mapG(d.genres||[]);let ty=m==='movie'?'Film':'Série';if(g.includes('Documentaire'))ty='Doc';
  const id=Number(String(i)+(m==='tv'?'2':'1'))+1000000;
  const n=d.vote_average?Math.round(d.vote_average*10)/10:0;
  const obj={id,t:d.title||d.name,ty,y:(d.release_date||d.first_air_date||'').slice(0,4),g:g.join(', '),n,pl:pi.fl,av:true,np:'Ajouté depuis l\'app · note TMDB (pas IMDb)',vu:false,avis:'',im:(d.external_ids||{}).imdb_id||'',po:(d.poster_path||'').replace(/^\//,'').replace(/\.jpg$/,''),tm:+i,tt:m==='movie'?'m':'t',tmdb:true};
  const s0=S(id);s0.add=obj;delete s0.del;prov[id]=pi;save();return obj}
ares.addEventListener('click',async e=>{const b=e.target.closest('.ar');if(!b)return;ares.innerHTML='<div class="none">Ajout en cours…</div>';
  try{const obj=await addTitle(b.dataset.m,b.dataset.i);aq.value='';ares.innerHTML='<div class="none">✓ « '+esc(obj.t)+' » ajouté</div>';drawFilters();render()}catch(err){ares.innerHTML='<div class="none">Ajout impossible, réessaie</div>'}});

    const live=DATA.filter(d=>!(st[d.id]&&st[d.id].del));const have=new Set(live.filter(d=>d.tm).map(d=>d.tt+d.tm));const have2=new Set(live.map(d=>nrm(d.t)+'|'+d.y));

/* Synchro GitHub (version app uniquement) */
const REPO='prunedeloriol-code/filmology',SP='state.json',TK='filmology-token';
let tok='';try{tok=localStorage.getItem(TK)||''}catch(e){}
let timer=null,busy=false,again=false;
const merge=(a,b)=>{const o={...a};for(const k in b){if(!o[k]||(b[k].ts||0)>(o[k].ts||0))o[k]=b[k]}return o};
const dec=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,''))));
const enc=t=>btoa(unescape(encodeURIComponent(t)));
const H=()=>({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'});
function msg(t,ask){sync.hidden=false;sync.innerHTML=esc(t)+(ask?' <button class="chip" id="tokBtn">'+(tok?'Changer le jeton':'Activer la synchro')+'</button>':'');const b=document.getElementById('tokBtn');if(b)b.onclick=askTok}
function askTok(){sync.innerHTML='<input id="tokIn" type="password" placeholder="Colle ton jeton GitHub ici" autocomplete="off"><button class="chip" id="tokOk">Enregistrer</button>';tokOk.onclick=()=>{tok=tokIn.value.trim();try{localStorage.setItem(TK,tok)}catch(e){}pull(true)}}
async function remote(){if(!tok){const r=await fetch(SP+'?t='+Date.now());if(!r.ok)throw new Error('lecture');return{data:await r.json(),sha:null}}
  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${SP}?t=${Date.now()}`,{headers:H(),cache:'no-store'});
  if(r.status===404)return{data:{},sha:null};if(r.status===401||r.status===403)throw new Error('jeton');if(!r.ok)throw new Error('lecture');
  const j=await r.json();return{data:JSON.parse(dec(j.content)||'{}'),sha:j.sha}}
async function pull(push){try{msg('Synchronisation…');const r=await remote();st=merge(r.data,st);try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}render();
  if(tok&&(push||JSON.stringify(st)!==JSON.stringify(r.data)))await doPush();else msg(tok?'Synchronisé ✓':'Synchro désactivée : tes choix ne sont enregistrés que sur cet appareil',!tok)}
  catch(e){msg(e.message==='jeton'?'Jeton refusé : vérifie-le':'Hors ligne : modifications gardées sur cet appareil',true)}}
async function doPush(){if(busy){again=true;return}busy=true;try{
  const r=await remote();st=merge(r.data,st);const body={message:'Mise à jour Filmology',content:enc(JSON.stringify(st)),...(r.sha?{sha:r.sha}:{})};
  const p=await fetch(`https://api.github.com/repos/${REPO}/contents/${SP}`,{method:'PUT',headers:H(),body:JSON.stringify(body)});
  if(p.status===409||p.status===422){busy=false;return doPush()}if(!p.ok)throw new Error('jeton');
  try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}render();msg('Synchronisé ✓',true)}
  catch(e){msg('Échec de la synchro : modifications gardées sur cet appareil',true)}finally{busy=false;if(again){again=false;doPush()}}}
function sched(){if(!POSTERS||!tok)return;clearTimeout(timer);timer=setTimeout(doPush,1200)}
document.addEventListener('visibilitychange',()=>{if(POSTERS&&!document.hidden)pull()});
plus.hidden=true;addpanel.hidden=true;
addEventListener('scroll',()=>{up.hidden=scrollY<500},{passive:true});up.onclick=()=>scrollTo({top:0,behavior:'smooth'});
drawFilters();render();if(POSTERS){pull();castLoad()}
